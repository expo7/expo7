<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">EXPO7 operating loop</title>
  <desc id="desc">A continuous loop from idea through specification, delegation, building, testing, deployment, observation, and iteration, killing, or scaling.</desc>
  <rect width="1200" height="270" fill="#15191d"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="35" fill="#95a7b2" font-size="13" letter-spacing="2.5">OPERATING LOOP / PRODUCTION AS INSTRUMENT</text>
    <g fill="#1c2329" stroke="#53636d" stroke-width="1">
      <rect x="40" y="82" width="112" height="70"/><rect x="181" y="82" width="112" height="70"/>
      <rect x="322" y="82" width="112" height="70"/><rect x="463" y="82" width="112" height="70"/>
      <rect x="604" y="82" width="112" height="70"/><rect x="745" y="82" width="112" height="70"/>
      <rect x="886" y="82" width="112" height="70"/><rect x="1027" y="82" width="133" height="70"/>
    </g>
    <g fill="#dbe3e7" font-size="14" font-weight="700" text-anchor="middle" letter-spacing=".8">
      <text x="96" y="123">IDEA</text><text x="237" y="123">SPECIFY</text>
      <text x="378" y="123">DELEGATE</text><text x="519" y="123">BUILD</text>
      <text x="660" y="123">TEST</text><text x="801" y="123">DEPLOY</text>
      <text x="942" y="123">OBSERVE</text><text x="1093" y="116">ITERATE</text><text x="1093" y="136">KILL / SCALE</text>
    </g>
    <g fill="#8fa4af" font-size="20" text-anchor="middle">
      <text x="166" y="125">→</text><text x="307" y="125">→</text><text x="448" y="125">→</text>
      <text x="589" y="125">→</text><text x="730" y="125">→</text><text x="871" y="125">→</text><text x="1012" y="125">→</text>
    </g>
    <path d="M1093 171V204H96V171" fill="none" stroke="#91a7b2" stroke-width="1.5"/>
    <path d="M103 195L96 204L89 195" fill="none" stroke="#91a7b2" stroke-width="1.5"/>
    <text x="600" y="235" fill="#b7c5cc" font-size="15" text-anchor="middle" letter-spacing="1">DEPLOYMENT GENERATES EVIDENCE FOR THE NEXT ITERATION</text>
  </g>
</svg>
